# E-Market production stack: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# Only nginx publishes ports (80/443). Everything else talks over the private "backend" network.
# api and web images come from GHCR (CI). To build them locally add -f docker-compose.build.yml (docs/deploy.md).
# nginx and backup are small images built on the server from ./deploy.

name: emarket

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  minio:
    # MinIO stopped publishing free community images on Docker Hub in 2025; Chainguard's build, pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    <<: [*restart, *logging]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ""
    volumes:
      - miniodata:/data
    networks: [backend]

  # One-shot: creates the photo and backup buckets, then exits.
  minio-init:
    image: emarket-backup:local
    build: ./deploy/backup
    command: ["init-buckets"]
    environment: &backup-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-photos}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      TZ: Asia/Tashkent
    depends_on:
      minio: { condition: service_started }
    restart: "no"
    networks: [backend]

  # Daily pg_dump -> host directory BACKUP_DIR + MinIO bucket (+ optional off-site remote), 30 days kept.
  backup:
    image: emarket-backup:local
    build: ./deploy/backup
    <<: [*restart, *logging]
    environment: *backup-env
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [backend]

  api:
    image: ghcr.io/${GHCR_OWNER:-local}/karvon-api:${API_IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      TZ: Asia/Tashkent
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
      ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
      ESKIZ_FROM: ${ESKIZ_FROM:-4546}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
      TAOBAO_API_URL: ${TAOBAO_API_URL:?set TAOBAO_API_URL}
      TAOBAO_API_KEY: ${TAOBAO_API_KEY:?set TAOBAO_API_KEY}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-google}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:?set TRANSLATION_API_KEY}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      PAYME_KEY: ${PAYME_KEY:?set PAYME_KEY}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:?set PAYME_MERCHANT_ID}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      PAYME_ALLOWED_IPS: ${PAYME_ALLOWED_IPS:?set PAYME_ALLOWED_IPS}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:?set CLICK_SECRET_KEY}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:?set CLICK_SERVICE_ID}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:?set CLICK_MERCHANT_ID}
      CLICK_ALLOWED_IPS: ${CLICK_ALLOWED_IPS:?set CLICK_ALLOWED_IPS}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-photos}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PUBLIC_BASE_URL: https://${API_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      PAYMENT_RETURN_URL: https://${SITE_DOMAIN}${HTTPS_PORT_SUFFIX:-}/account/orders
      SITE_URL: https://${SITE_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      REVIEW_URL: ${REVIEW_URL:-}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN_API:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [backend]

  web:
    image: ghcr.io/${GHCR_OWNER:-local}/karvon-web:${WEB_IMAGE_TAG:-latest}
    <<: [*restart, *logging]
    environment:
      SITE_URL: https://${SITE_DOMAIN}${HTTPS_PORT_SUFFIX:-}
      BACKEND_URL: http://api:8080
      NEXT_PUBLIC_DELIVERY_DAYS: ${NEXT_PUBLIC_DELIVERY_DAYS:-}
      SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      TZ: Asia/Tashkent
    depends_on:
      api: { condition: service_healthy }
    networks: [backend]

  nginx:
    image: emarket-nginx:local
    build: ./deploy/nginx
    <<: [*restart, *logging]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:?set FILES_DOMAIN}
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
      NGINX_ENVSUBST_FILTER: "^(SITE_DOMAIN|API_DOMAIN|FILES_DOMAIN|HTTPS_PORT_SUFFIX)$$"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [backend]

  # Renews the Let's Encrypt certificate (first issue: docs/deploy.md). nginx reloads it within 6 hours.
  certbot:
    image: certbot/certbot:v5.1.0
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  miniodata:
  letsencrypt:
  certbot-www:
