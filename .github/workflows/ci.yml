name: CI

# Pull requests: build and test the API, check the Docker image and the production compose file.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and integration tests (Testcontainers uses the runner's Docker).
      - run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production compose file is valid
        run: docker compose --env-file deploy/local-test.env -f docker-compose.prod.yml config --quiet
      - name: nginx and backup images build
        run: docker compose --env-file deploy/local-test.env -f docker-compose.prod.yml build nginx backup
