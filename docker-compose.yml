# Local infrastructure for the "dev" profile. Values are read from .env (see .env.example).
services:
  postgres:
    image: postgres:16
    container_name: karvon-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-karvon}
      POSTGRES_USER: ${DB_USERNAME:-karvon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karvon}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: karvon-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
