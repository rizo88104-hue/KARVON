# Production. Every value comes from environment variables, there are no defaults on purpose:
# the app refuses to start if one is missing.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT}

karvon:
  sms:
    eskiz:
      email: ${ESKIZ_EMAIL}
      password: ${ESKIZ_PASSWORD}
      from: ${ESKIZ_FROM}
