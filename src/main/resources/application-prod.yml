# Production. Every value comes from environment variables, there are no defaults on purpose:
# the app refuses to start if one is missing.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT}

karvon:
  # Required (no defaults): CORS origins of the site, Payme/Click callback IPs, the Prometheus scrape token.
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    payme-allowed-ips: ${PAYME_ALLOWED_IPS}
    click-allowed-ips: ${CLICK_ALLOWED_IPS}
    metrics-token: ${METRICS_TOKEN}
  sms:
    eskiz:
      email: ${ESKIZ_EMAIL}
      password: ${ESKIZ_PASSWORD}
      from: ${ESKIZ_FROM}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
  taobao:
    api-url: ${TAOBAO_API_URL}
    api-key: ${TAOBAO_API_KEY}
  files:
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION}
      bucket: ${S3_BUCKET}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
  payment:
    payme:
      login: ${PAYME_LOGIN}
      key: ${PAYME_KEY}
      merchant-id: ${PAYME_MERCHANT_ID}
    click:
      secret-key: ${CLICK_SECRET_KEY}
      service-id: ${CLICK_SERVICE_ID}
      merchant-id: ${CLICK_MERCHANT_ID}

translation:
  # google or yandex
  provider: ${TRANSLATION_PROVIDER}
  api-key: ${TRANSLATION_API_KEY}
  yandex:
    # only for Yandex user accounts; a service account API key does not need it
    folder-id: ${YANDEX_FOLDER_ID:}

# JSON logs (ECS format) for log collectors; every line carries the request id from the MDC.
logging:
  structured:
    format:
      console: ecs

# No public API documentation in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

sentry:
  environment: ${SENTRY_ENVIRONMENT:production}
