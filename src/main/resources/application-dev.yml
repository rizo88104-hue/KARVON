# Local development. Start Postgres and Redis with "docker compose up -d".
# Values may be overridden in a local .env file (see .env.example); the defaults match docker-compose.yml.
# External services (Taobao, translation, SMS, Payme, Click) use their Fake
# implementations in this profile (@Profile("dev")). Telegram: the real bot when TELEGRAM_BOT_TOKEN is set, else a fake.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:karvon}
    username: ${DB_USERNAME:karvon}
    password: ${DB_PASSWORD:karvon}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    uz.karvon: DEBUG

karvon:
  security:
    # The site in dev (next dev).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Dev-only fallback so the app starts without a .env file. Production has no default.
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
  telegram:
    # Without TELEGRAM_BOT_TOKEN the fake bot only logs (POST /api/v1/dev/otp/{phone}/telegram-login stands in for
    # it). With TELEGRAM_BOT_TOKEN and TELEGRAM_BOT_USERNAME in .env the real bot runs with long polling.
    bot-username: ${TELEGRAM_BOT_USERNAME:karvon_dev_bot}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:dev-telegram-secret}
  admin:
    # Dev-only default so a dev ADMIN exists; log in with the code from GET /api/v1/dev/otp/{phone}.
    phone: ${ADMIN_PHONE:+998901234567}
