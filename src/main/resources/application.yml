# Settings shared by every profile. Connection values live in application-dev.yml / application-prod.yml.
spring:
  application:
    name: karvon-api
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # parcel photos: 5 MB each, at most 4 per request
      max-file-size: 5MB
      max-request-size: 21MB

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

karvon:
  auth:
    # HS256 key, at least 32 bytes. Required: there is no default outside the dev profile.
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp:
      code-ttl: 2m
      max-requests: 3
      request-window: 10m
      max-wrong-attempts: 5
      block-duration: 15m
  catalog:
    cache:
      search-ttl: 30m
      product-ttl: 2h
  orders:
    # Unpaid orders are cancelled after this time; the check runs every auto-cancel-check-ms.
    payment-timeout: 30m
    auto-cancel-check-ms: 60000
  payment:
    # Where the customer returns after paying (optional) and the base URL of this API (dev fake checkout link).
    return-url: ${PAYMENT_RETURN_URL:}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    payme:
      login: ${PAYME_LOGIN:}
      key: ${PAYME_KEY:}
      merchant-id: ${PAYME_MERCHANT_ID:}
      checkout-url: ${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
    click:
      secret-key: ${CLICK_SECRET_KEY:}
      service-id: ${CLICK_SERVICE_ID:}
      merchant-id: ${CLICK_MERCHANT_ID:}
  files:
    # dev/test: local directory; prod: S3-compatible bucket (S3_*)
    local-dir: ${FILE_STORAGE_DIR:./data/files}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  admin:
    # Phone of the first ADMIN, created on startup if missing. Empty = skip.
    phone: ${ADMIN_PHONE:}
  telegram:
    # Required: there is no default outside the dev profile. The token (TELEGRAM_BOT_TOKEN) is read in prod only.
    bot-username: ${TELEGRAM_BOT_USERNAME}
    # Telegram sends it in X-Telegram-Bot-Api-Secret-Token (setWebhook secret_token).
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
    link-ttl: 15m
  notification:
    # Bounded pool for sending; when the queue is full the caller sends itself.
    threads: 2
    max-threads: 4
    queue-capacity: 1000
    # FAILED notifications are retried (5 times, 1-16 min backoff) by a job running this often.
    retry-check-ms: 60000
