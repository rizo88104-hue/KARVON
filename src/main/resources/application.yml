# Settings shared by every profile. Connection values live in application-dev.yml / application-prod.yml.
spring:
  application:
    name: karvon-api
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

karvon:
  auth:
    # HS256 key, at least 32 bytes. Required: there is no default outside the dev profile.
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    otp:
      code-ttl: 2m
      max-requests: 3
      request-window: 10m
      max-wrong-attempts: 5
      block-duration: 15m
  catalog:
    cache:
      search-ttl: 30m
      product-ttl: 2h
  orders:
    # Unpaid orders are cancelled after this time; the check runs every auto-cancel-check-ms.
    payment-timeout: 30m
    auto-cancel-check-ms: 60000
  admin:
    # Phone of the first ADMIN, created on startup if missing. Empty = skip.
    phone: ${ADMIN_PHONE:}
