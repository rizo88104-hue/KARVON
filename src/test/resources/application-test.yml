# Integration tests: containers supply Postgres and Redis, the fake SMS sender is used.
karvon:
  auth:
    jwt-secret: test-only-jwt-secret-0123456789abcdefghij
  admin:
    phone: "+998900000001"
  telegram:
    bot-username: karvon_test_bot
    webhook-secret: test-telegram-secret
  notification:
    # Send in the test thread right after the commit, so tests can check the result at once.
    async: false
    # The retry job is called by the tests themselves.
    retry-check-ms: 3600000
  files:
    local-dir: ${java.io.tmpdir}/karvon-test-files
  payment:
    payme:
      login: Paycom
      key: test-payme-key
      merchant-id: test-merchant
    click:
      secret-key: test-click-secret
      service-id: "36"
      merchant-id: "46"
